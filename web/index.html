<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="O roteiro, os gastos e as fotos da viagem em um lugar só.">
  <meta name="theme-color" content="#FFF9F6">

  <!-- PWA / iOS: permite instalar na tela inicial, que é a estratégia para iPhone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WeGoTravel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Pré-conexão às fontes: reduz o salto de layout no primeiro carregamento -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>WeGoTravel</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FFF9F6; }

    /* Splash: o bundle do Flutter Web leva alguns segundos no primeiro
       acesso. Sem isto o usuário encara uma tela branca. Repete a splash
       do app — o nome "WeGoTravel" e uma barra fina —, para a troca não
       aparecer. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #FFF9F6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #2B201E;
      z-index: 9999;
      transition: opacity .2s ease, visibility .2s ease;
    }
    #splash.hidden { opacity: 0; visibility: hidden; }

    .splash-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.84px;
      background: linear-gradient(90deg, #E5665E, #F29E5C);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .splash-bar { border-radius: 2px; }
    .splash-bar {
      width: 120px;
      height: 2px;
      background: #FAEEEA;
      overflow: hidden;
    }
    .splash-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #E5665E, #F29E5C);
      animation: slide 1.3s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-bar::after { animation: none; }
    }
    /* Tema escuro: a classe é posta pelo script logo abaixo, antes de a
       página pintar, para a splash já nascer na cor que o app vai usar. */
    html.dark, html.dark body, html.dark #splash { background: #171211; }
    html.dark #splash { color: #F6ECE9; }
    html.dark .splash-bar { background: #2E2422; }
    html.dark .splash-bar::after { background: linear-gradient(90deg, #F2857D, #F29E5C); }
  </style>
  <script>
    // Mesma regra do app: o tema salvo no aparelho (o shared_preferences
    // grava em `flutter.theme_mode`, como JSON) ou, sem escolha, o do
    // sistema.
    (function () {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem('flutter.theme_mode')); } catch (e) {}
      var dark = saved === 'dark' ||
        (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (dark && meta) meta.setAttribute('content', '#171211');
    })();
  </script>
</head>
<body>
  <div id="splash">
    <div class="splash-title">WeGoTravel</div>
    <div class="splash-bar"></div>
  </div>

  <script>
    // Removido pelo Flutter assim que o primeiro frame é pintado.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 500);
      }
    });

    // O service worker é o nosso (web/sw.js), não o do Flutter — o
    // gerado pelo build se desregistra sozinho desde o Flutter 3.41.
    // Ver o comentário no topo de web/sw.js.
    //
    // Fora do localhost de propósito: em desenvolvimento um worker
    // guardando o bundle serve código velho depois de cada edição.
    //
    // Registrado após o primeiro frame para não disputar banda com o
    // bundle no primeiro acesso, que é justamente o mais lento.
    var devHosts = ['localhost', '127.0.0.1', '[::1]'];
    if ('serviceWorker' in navigator && devHosts.indexOf(location.hostname) < 0) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
