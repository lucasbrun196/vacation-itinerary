name: vacation_itinerary
description: "WeGoTravel: roteiro, contas e mural de viagem compartilhada."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.9.0
  file_picker: ^12.0.0
  firebase_auth: ^6.6.0
  firebase_core: ^4.14.0
  firebase_storage: ^13.5.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_map: ^8.3.1
  flutter_riverpod: ^2.6.1
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  intl: ^0.20.2
  latlong2: ^0.10.1
  photo_view: ^0.15.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  video_player: ^2.11.1
  flutter_svg: ^2.3.0

# Correção temporária: firebase_core_web 3.11.0 não compila no Dart 3.11.
# Detalhes e instruções de remoção em third_party/firebase_core_web/PATCH.md
dependency_overrides:
  firebase_core_web:
    path: third_party/firebase_core_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
